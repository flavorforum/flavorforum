# Flavor Forum: update the paper list and publish the site.
#
# Runs
#   - every day at 06:47 IST (01:17 UTC): fetch new papers, commit, publish
#   - on every push to main: publish (so your own edits go live as before)
#   - by hand: Actions tab → "Update papers and publish site" → Run workflow
#
# One-time setup: Settings → Pages → Build and deployment → Source: GitHub Actions.

name: Update papers and publish site

on:
  schedule:
    - cron: "17 1 * * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # to commit assets/papers.json
  pages: write      # to publish
  id-token: write   # needed by actions/deploy-pages

concurrency:
  group: site
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch papers from INSPIRE
        # If INSPIRE is down, keep yesterday's list and still publish.
        continue-on-error: true
        run: python3 scripts/fetch_papers.py

      - name: Commit the paper list if it changed
        run: |
          if ! git diff --quiet -- assets/papers.json || ! git ls-files --error-unmatch assets/papers.json >/dev/null 2>&1; then
            git config user.name "flavorforum-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add assets/papers.json
            git commit -m "Update paper list"
            git pull --rebase --quiet
            git push
          else
            echo "Paper list unchanged"
          fi

      - name: Collect the files to publish
        run: |
          mkdir -p _site
          rsync -a --exclude '.git' --exclude '.github' --exclude '_site' \
                   --exclude 'scripts' --exclude 'worker' --exclude 'README.md' ./ _site/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
